kind = "web"
previewPath = "/"
title = "School Management Portal"
description = "A React and Node.js school management website for tracking student and staff attendance, mapping students to classes, reviewing fee status and student performance, managing homepage media, and sharing school events."
version = "1.0.0"
id = "artifacts/school-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18112

[services.development]
run = "pnpm --filter @workspace/school-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/school-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/school-portal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18112"
BASE_PATH = "/"
